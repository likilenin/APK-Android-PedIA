org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Versión de la app. Para publicar una actualización: subir VERSION_CODE en 1, cambiar
# VERSION_NAME y crear la etiqueta git "v<VERSION_NAME>" (ver README.md).
VERSION_CODE=3
VERSION_NAME=1.0.2

# Repositorio de GitHub (usuario/nombre) donde se publican las actualizaciones. Se puede
# cambiar también desde Ajustes dentro de la app.
REPO_ACTUALIZACIONES=likilenin/APK-Android-PedIA
